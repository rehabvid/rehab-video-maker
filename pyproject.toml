[project]
name = "rehab-slideshow"
version = "0.1.0"
description = "Narrated rehabilitation slideshow builder for post-breast-surgery exercise videos"
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=7.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
youtube = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]
trending = [
    "google-api-python-client>=2.100",
    "youtube-transcript-api>=1.2",
]

[project.scripts]
rehab-slideshow = "rehab_slideshow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rehab_slideshow"]
