<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html,body{margin:0;background:transparent;overflow:hidden}
  canvas{display:block;position:relative;z-index:1}
  #mouth,#eyeL,#eyeR{z-index:3}
  #mouth{position:absolute;left:50%;top:60.5%;transform:translate(-50%,-50%);
    background:#3a1a1a;border-radius:50%;opacity:.95;pointer-events:none}
  #eyeL,#eyeR{position:absolute;top:45.5%;width:11%;height:2.4%;
    background:#3a241c;border-radius:40%;transform:translate(-50%,-50%);
    opacity:0;pointer-events:none}
  #eyeL{left:38%}#eyeR{left:62%}
</style>
<script type="importmap">
{
  "imports": {
    "three": "../../modules/linkZagShow/node_modules/three/build/three.module.js",
    "three/addons/": "../../modules/linkZagShow/node_modules/three/examples/jsm/",
    "@pixiv/three-vrm": "../../modules/linkZagShow/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
  }
}
</script>
</head>
<body>
<div id="mouth"></div>
<div id="eyeL"></div>
<div id="eyeR"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const params = new URLSearchParams(location.search);
const modelUrl = params.get('model');
const size = Number(params.get('size') || 512);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(size, size);
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 20);
const light = new THREE.DirectionalLight(0xffffff, 2.0);
light.position.set(0.5, 1.2, 1.5);
scene.add(light, new THREE.AmbientLight(0xffffff, 1.25));

let vrm = null;
const VISEMES = ['aa', 'ih', 'ou', 'ee', 'oh'];
const weights = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };

const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));
loader.load(modelUrl, (gltf) => {
  VRMUtils.removeUnnecessaryVertices(gltf.scene);
  VRMUtils.combineSkeletons(gltf.scene);
  vrm = gltf.userData.vrm;
  if (!vrm) { window.__error = 'VRM plugin did not return a VRM'; return; }
  scene.add(vrm.scene);
  // VRM 1.0 already faces +Z (the camera); VRM 0.x needs a 180° flip.
  const isVRM0 = !gltf.userData.vrm.meta?.metaVersion;
  if (isVRM0) VRMUtils.rotateVRM0(vrm);

  const lArm = vrm.humanoid?.getNormalizedBoneNode('leftUpperArm');
  const rArm = vrm.humanoid?.getNormalizedBoneNode('rightUpperArm');
  if (lArm) lArm.rotation.z = 1.15;
  if (rArm) rArm.rotation.z = -1.15;

  const box = new THREE.Box3().setFromObject(vrm.scene);
  const center = box.getCenter(new THREE.Vector3());
  const height = box.max.y - box.min.y;
  const head = vrm.humanoid?.getNormalizedBoneNode('head');
  const headPos = head
    ? head.getWorldPosition(new THREE.Vector3())
    : new THREE.Vector3(center.x, center.y + height * 0.3, center.z);
  // Frame head + shoulders: look a little above the head bone, back off enough
  // that the whole head and collar stay inside a square crop.
  // Head + shoulders, with the head around two-thirds of the square so the
  // 1/3 overlay still reads at feed size.
  const headTarget = headPos.y + height * 0.035;
  camera.position.set(headPos.x, headTarget, headPos.z + height * 0.62);
  camera.lookAt(headPos.x, headTarget, headPos.z);

  const mouth = document.getElementById('mouth');
  if (mouth) mouth.style.width = (size * 0.11) + 'px';

  window.__vrm = vrm;
  window.__hasFace = !!(vrm.expressionManager && (vrm.expressionManager.expressions || []).length);
  window.__expressions = (vrm.expressionManager?.expressions || []).map((e) => e.expressionName);
  window.__weights = weights;
  window.__probe = () => {
    let face = null;
    vrm.scene.traverse((o) => {
      if (!face && o.name && o.name.toLowerCase().startsWith('face')) face = o;
    });
    vrm.scene.updateMatrixWorld(true);
    const m = face ? face.matrixWorld : vrm.scene.matrixWorld;
    const pt = (x, y, z) => {
      const v = new THREE.Vector3(x, y, z).applyMatrix4(m).project(camera);
      return [Math.round((v.x * 0.5 + 0.5) * size), Math.round((-v.y * 0.5 + 0.5) * size)];
    };
    const bone = (name) => {
      const b = vrm.humanoid?.getNormalizedBoneNode(name);
      if (!b) return null;
      const v = b.getWorldPosition(new THREE.Vector3()).project(camera);
      return [Math.round((v.x * 0.5 + 0.5) * size), Math.round((-v.y * 0.5 + 0.5) * size)];
    };
    return {
      face: face ? face.name : null,
      eyeL: pt(-0.05, 1.50, 0.09), eyeR: pt(0.05, 1.50, 0.09),
      mouth: pt(0, 1.42, 0.09), top: pt(0, 1.655, 0.04), chin: pt(0, 1.375, 0.09),
      boneHead: bone('head'), boneLeftEye: bone('leftEye'), boneRightEye: bone('rightEye'),
    };
  };
  window.__ready = true;
}, undefined, (err) => { window.__error = String(err); });

window.renderFrame = ({ viseme = null, mouth = 0, blink = 0, yaw = 0, t = 0, dt = 1 / 15 }) => {
  if (!vrm) return false;
  const em = vrm.expressionManager;
  const hasFace = !!(em && (em.expressions || []).length);

  // DOM fallback only when the model has no blendshapes at all.
  const mouthEl = document.getElementById('mouth');
  if (mouthEl) {
    mouthEl.style.opacity = hasFace ? '0' : '0.95';
    mouthEl.style.height = (5 + 17 * Math.max(0, Math.min(1, mouth))) + 'px';
  }
  if (!hasFace) {
    const bl = blink > 0.5 ? '1' : '0';
    const el = document.getElementById('eyeL');
    const er = document.getElementById('eyeR');
    if (el) el.style.opacity = bl;
    if (er) er.style.opacity = bl;
  }

  if (em && hasFace) {
    // Ease each viseme toward its target so syllables blend instead of pop.
    const k = 1 - Math.exp(-dt / 0.055);
    const open = 0.82 + 0.18 * Math.max(0, Math.min(1, mouth));
    for (const name of VISEMES) {
      const target = name === viseme ? open : 0;
      weights[name] += (target - weights[name]) * k;
      try { em.setValue(name, weights[name]); } catch (_) {}
    }
    try { em.setValue('blink', Math.max(0, Math.min(1, blink))); } catch (_) {}
  }

  const head = vrm.humanoid?.getNormalizedBoneNode('head');
  if (head) head.rotation.y = yaw * 0.18;
  const la = vrm.humanoid?.getNormalizedBoneNode('leftUpperArm');
  const ra = vrm.humanoid?.getNormalizedBoneNode('rightUpperArm');
  if (la) la.rotation.z = -1.25;
  if (ra) ra.rotation.z = 1.25;
  vrm.update(dt);
  renderer.render(scene, camera);
  return true;
};

window.__ready = false;
</script>
</body>
</html>
