id: elbow-range-of-motion
title: Elbow Range of Motion
subtitle: Elbow bending and straightening
recovery_phase: weeks-1-2
phase_label: Week 1-2 after surgery
target_area: elbow flexion and extension
affected_side: right
start_criteria: >-
  Usually started in the first days after surgery. Confirm with your surgeon or
  physiotherapist before starting.
frequency: 3 times a day
repetitions: 10
repetitions_max: 10
hold_seconds: 2
movement_tempo: slow and controlled
precautions:
  - Keep the upper arm close to your side and your shoulder relaxed.
  - Bend and straighten only as far as is comfortable.
  - Do not lift the arm above shoulder level in the first week.
  - Follow any range-of-motion limit given by your surgeon.
stop_if:
  - Pain increases during or after the exercise.
  - The wound area becomes more swollen, red, or warm.
  - You feel dizzy, breathless, or unwell.
source:
  title: Exercises after breast surgery
  publisher: Canadian Cancer Society
  year: 2024
  url: https://cdn.cancer.ca/-/media/files/cancer-information/resources/publications/exercises-after-breast-surgery/32437-exercises-after-breast-surgery-en.pdf
  note: >-
    Early elbow range-of-motion work keeps the joint moving while the shoulder is
    protected; hold for 1 to 2 seconds at the end of the movement.
clinical_review:
  status: pending
  reviewer: null
  reviewed_on: null
